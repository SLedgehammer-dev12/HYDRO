  #     POSTGRES_DB: hydro
  #     POSTGRES_USER: hydro
  #     POSTGRES_PASSWORD: hydro
  #   volumes:
  #     - hydro-db:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  hydro-data:
