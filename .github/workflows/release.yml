name: Release App

on:
  push:
    tags:
      - "hidrostatik-test-v*"
  workflow_dispatch:
    inputs:
      pre_release:
        description: 'Pre-release olarak isaretle'
        required: false
        default: false
        type: boolean

# Varsayilan en dar yetki; yalnizca publish-release job'i yazma alir.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  version_gate:
    name: Tag / APP_VERSION dogrulamasi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read APP_VERSION from app_metadata
        id: metadata
        run: |
          python3 -c "import pathlib, re; text = pathlib.Path('hidrostatik_test/app_metadata.py').read_text(encoding='utf-8'); print(re.search(r'^APP_VERSION = \"([^\"]+)\"', text, re.M).group(1))" > app_version.txt
          echo "app_version=$(cat app_version.txt)" >> "$GITHUB_OUTPUT"

      # Surum tek kaynaktan (app_metadata.py) okunur; tag ile uyusmazsa release durur.
      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="hidrostatik-test-v${{ steps.metadata.outputs.app_version }}"
          actual="${GITHUB_REF_NAME}"
          echo "Beklenen tag: $expected"
          echo "Gercek tag  : $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag ile APP_VERSION uyusmuyor. app_metadata.py guncellenmeden release alinamaz."
            exit 1
          fi

  # Guncelleme paketleri imzasiz yayinlanmaz: secret yoksa tum release zinciri
  # daha build baslamadan acik bir mesajla durur.
  signing_key_check:
    name: Guncelleme imza anahtari kontrolu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Verify HYDRO_UPDATE_PRIVATE_KEY secret
        env:
          HYDRO_UPDATE_PRIVATE_KEY: ${{ secrets.HYDRO_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HYDRO_UPDATE_PRIVATE_KEY:-}" ]; then
            echo "::error::HYDRO_UPDATE_PRIVATE_KEY secret tanimli degil. Imzasiz guncelleme paketi yayinlanmaz; release durduruldu. Repo Settings > Secrets and variables > Actions uzerinden Ed25519 ozel anahtarini ekleyin (bkz. docs/release.md)."
            exit 1
          fi
          echo "Guncelleme imza anahtari secret'i mevcut."

  test:
    name: Test (Linux + Xvfb)
    needs: version_gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # UI testleri atlanmasin: Tkinter sanal ekranda calisir.
      - name: Run tests under Xvfb
        run: |
          xvfb-run --auto-servernum python -m coverage run -m unittest discover -s tests -p "test_*.py" -v

      - name: Coverage gate
        run: |
          python -m coverage report

  build-windows:
    name: Windows build
    needs: [ version_gate, test, signing_key_check ]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .\requirements-dev.txt

      # Ozel anahtar yalnizca runner uzerinde, gecici kullanici profilinde tutulur.
      - name: Prepare update signing key
        shell: pwsh
        env:
          HYDRO_UPDATE_PRIVATE_KEY: ${{ secrets.HYDRO_UPDATE_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HYDRO_UPDATE_PRIVATE_KEY)) {
            Write-Error "HYDRO_UPDATE_PRIVATE_KEY secret tanimli degil; imzasiz release yayinlanmaz."
            exit 1
          }
          $keyDir = Join-Path $env:USERPROFILE ".config\hydro"
          New-Item -ItemType Directory -Path $keyDir -Force | Out-Null
          $keyPath = Join-Path $keyDir "update_signing_key.pem"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($keyPath, $env:HYDRO_UPDATE_PRIVATE_KEY.TrimEnd() + "`n", $utf8NoBom)
          Write-Host "Guncelleme imza anahtari hazirlandi."

      - name: Build release package
        run: |
          powershell -ExecutionPolicy Bypass -File .\build_exe.ps1

      # Artefakt sozlesmesi: zip + .sig + iki checksum adi + release notes.
      - name: Verify build artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.version_gate.outputs.app_version }}"
          $baseName = "HidrostatikTest-v$version-windows-x64"
          $zip = Join-Path .\release "$baseName.zip"
          $sig = Join-Path .\release "$baseName.zip.sig"
          $sha = Join-Path .\release "$baseName.sha256.txt"
          $zipSha = Join-Path .\release "$baseName.zip.sha256.txt"
          $notes = Join-Path .\release "$baseName-RELEASE-NOTES.md"
          foreach ($path in @($zip, $sig, $sha, $zipSha, $notes)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Eksik artefakt: $path" }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entry = $archive.Entries | Where-Object { $_.FullName -eq "HidrostatikTest/HidrostatikTest.exe" }
            if (-not $entry) {
              throw "Zip icinde HidrostatikTest/HidrostatikTest.exe bulunamadi (updater bu yapiyi bekler)."
            }
            if ($entry.Length -lt 10MB) {
              throw "Zip icindeki exe cok kucuk ($($entry.Length) bytes)."
            }
            Write-Host "Zip dogrulandi: $($entry.FullName) ($('{0:N0}' -f ($entry.Length / 1MB)) MB)"
          } finally {
            $archive.Dispose()
          }

          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          foreach ($shaFile in @($sha, $zipSha)) {
            $recorded = ((Get-Content -LiteralPath $shaFile -Raw).Trim() -split '\s+')[0].ToLower()
            if ($recorded -ne $zipHash) {
              throw "$(Split-Path -Leaf $shaFile) icindeki hash zip ile uyusmuyor."
            }
          }
          Write-Host "SHA256 dogrulandi: $zipHash"

          python tools\update_signing.py verify $zip $sig
          if ($LASTEXITCODE -ne 0) { throw "Ed25519 imza dogrulanamadi: $sig" }
          Write-Host "Ed25519 imzasi dogrulandi."

      - name: Remove update signing key
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:USERPROFILE ".config\hydro\update_signing_key.pem"
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }

      - name: Resolve release assets
        id: assets
        shell: pwsh
        run: |
          $version = "${{ needs.version_gate.outputs.app_version }}"
          $baseName = "HidrostatikTest-v$version-windows-x64"
          "zip=$(Join-Path .\release "$baseName.zip")" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sig=$(Join-Path .\release "$baseName.zip.sig")" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha=$(Join-Path .\release "$baseName.sha256.txt")" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_sha=$(Join-Path .\release "$baseName.zip.sha256.txt")" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "notes=$(Join-Path .\release "$baseName-RELEASE-NOTES.md")" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            ${{ steps.assets.outputs.zip }}
            ${{ steps.assets.outputs.sig }}
            ${{ steps.assets.outputs.sha }}
            ${{ steps.assets.outputs.zip_sha }}
            ${{ steps.assets.outputs.notes }}
          retention-days: 7

  build-macos:
    name: macOS build
    needs: [ version_gate, test, signing_key_check ]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare update signing key
        shell: bash
        env:
          HYDRO_UPDATE_PRIVATE_KEY: ${{ secrets.HYDRO_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HYDRO_UPDATE_PRIVATE_KEY:-}" ]; then
            echo "::error::HYDRO_UPDATE_PRIVATE_KEY secret tanimli degil; imzasiz release yayinlanmaz."
            exit 1
          fi
          key_dir="$HOME/.config/hydro"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          printf '%s\n' "$HYDRO_UPDATE_PRIVATE_KEY" > "$key_dir/update_signing_key.pem"
          chmod 600 "$key_dir/update_signing_key.pem"
          echo "Guncelleme imza anahtari hazirlandi."

      - name: Build release package
        run: |
          chmod +x ./build_dmg.sh
          ./build_dmg.sh

      - name: Verify build artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version_gate.outputs.app_version }}"
          base="HidrostatikTest-v${version}-macos-universal"
          dmg="release/${base}.dmg"
          sig="release/${base}.dmg.sig"
          sha="release/${base}.sha256.txt"
          dmg_sha="release/${base}.dmg.sha256.txt"
          notes="release/${base}-RELEASE-NOTES.md"

          for path in "$dmg" "$sig" "$sha" "$dmg_sha" "$notes"; do
            if [ ! -f "$path" ]; then echo "ERROR: eksik artefakt: $path"; exit 1; fi
          done

          hdiutil verify "$dmg"
          size=$(du -sm "$dmg" | cut -f1)
          if [ "$size" -lt 10 ]; then echo "ERROR: DMG cok kucuk (${size} MB)."; exit 1; fi

          actual=$(shasum -a 256 "$dmg" | awk '{print $1}')
          for file in "$sha" "$dmg_sha"; do
            recorded=$(awk '{print $1}' "$file")
            if [ "$recorded" != "$actual" ]; then echo "ERROR: $(basename "$file") hash uyusmuyor."; exit 1; fi
          done
          python3 tools/update_signing.py verify "$dmg" "$sig"
          echo "DMG, SHA256 ve Ed25519 imzasi dogrulandi: $(basename "$dmg") (${size} MB)"

      - name: Remove update signing key
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.config/hydro/update_signing_key.pem"

      # Imza dogrulamasi build_dmg.sh icinde de yapilir; burada release kapisi olarak tekrarlanir.
      - name: Verify signature (ad-hoc veya Developer ID)
        shell: bash
        run: |
          set -euo pipefail
          app="dist/HidrostatikTest.app"
          if [ ! -d "$app" ]; then echo "ERROR: .app bulunamadi."; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "codesign dogrulandi."
          if spctl -a -vv "$app"; then
            echo "Gatekeeper kabul etti (Developer ID imzasi)."
          else
            echo "UYARI: Gatekeeper ad-hoc/unsigned paketi reddediyor; notarization yapilmadi."
          fi

      - name: Resolve release assets
        id: assets
        shell: bash
        run: |
          base="HidrostatikTest-v${{ needs.version_gate.outputs.app_version }}-macos-universal"
          echo "dmg=release/${base}.dmg" >> "$GITHUB_OUTPUT"
          echo "sig=release/${base}.dmg.sig" >> "$GITHUB_OUTPUT"
          echo "sha=release/${base}.sha256.txt" >> "$GITHUB_OUTPUT"
          echo "dmg_sha=release/${base}.dmg.sha256.txt" >> "$GITHUB_OUTPUT"
          echo "notes=release/${base}-RELEASE-NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Upload macos assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: |
            ${{ steps.assets.outputs.dmg }}
            ${{ steps.assets.outputs.sig }}
            ${{ steps.assets.outputs.sha }}
            ${{ steps.assets.outputs.dmg_sha }}
            ${{ steps.assets.outputs.notes }}
          retention-days: 7

  publish-release:
    name: GitHub release yayinla
    needs: [ version_gate, build-windows, build-macos, signing_key_check ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install signature verification dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42,<46"

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: windows-release

      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: macos-assets
          path: macos-release

      # Indirilen artefaktlarin bozulmadigini yayin oncesi dogrula.
      - name: Verify downloaded checksums
        run: |
          set -euo pipefail
          cd windows-release
          for file in *.zip.sha256.txt *.sha256.txt; do
            [ -f "$file" ] || continue
            sha256sum -c "$file"
          done
          cd ../macos-release
          for file in *.dmg.sha256.txt *.sha256.txt; do
            [ -f "$file" ] || continue
            sha256sum -c "$file"
          done

      # Imzasi dogrulanmayan artefakt yayinlanmaz (fail-closed).
      - name: Verify update signatures
        run: |
          set -euo pipefail
          for artifact in windows-release/*.zip macos-release/*.dmg; do
            python tools/update_signing.py verify "$artifact"
          done

      - name: Create unified release notes
        run: |
          {
            echo "# Hidrostatik Test Degerlendirme v${{ needs.version_gate.outputs.app_version }}"
            echo ""
            echo "## Yenilikler (Changelog)"
            echo "En guncel yenilikler ve tum surum gecmisi icin [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) dosyasina bakin."
            echo ""
            echo "## Windows"
            echo ""
            sed -e '1d' windows-release/*-RELEASE-NOTES.md
            echo ""
            echo "## macOS"
            echo ""
            sed -e '1d' macos-release/*-RELEASE-NOTES.md
          } > unified-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-release/*.zip
            windows-release/*.sig
            windows-release/*.sha256.txt
            windows-release/*-RELEASE-NOTES.md
            macos-release/*.dmg
            macos-release/*.sig
            macos-release/*.sha256.txt
            macos-release/*-RELEASE-NOTES.md
          body_path: unified-notes.md
          prerelease: ${{ github.event.inputs.pre_release == 'true' }}
