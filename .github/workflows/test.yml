name: Test

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - 'agents/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Tkinter tabanli UI testleri Linux'ta sanal ekran ister.
      - name: Run tests under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum python -m coverage run -m unittest discover -s tests -p "test_*.py" -v

      - name: Run tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: |
          python -m coverage run -m unittest discover -s tests -p "test_*.py" -v

      - name: Coverage report and XML
        run: |
          python -m coverage xml
          python -m coverage report

      # Tip kapisi lint.yml icinde (domain bloklayici, tam paket bilgilendirici) calisir;
      # matriste tekrarlanmaz.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  web-backend-tests:
    name: Web Backend Pytest (py3.12 / ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r webapp/requirements-web.txt

      - name: Run web backend pytest suite with coverage gate
        run: |
          python -m coverage run --source=webapp/backend/app -m pytest webapp/backend/tests -q
          python -m coverage report --fail-under=80

  web-postgres-tests:
    name: Web Backend PostgreSQL Runtime (py3.12 / ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hydro
          POSTGRES_USER: hydro
          POSTGRES_PASSWORD: hydro_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hydro -d hydro"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Python + PostgreSQL driver dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r webapp/requirements-web.txt "psycopg[binary]>=3.2,<4"

      - name: Run PostgreSQL Alembic & CRUD smoke suite
        env:
          HYDRO_TEST_POSTGRES_URL: postgresql+psycopg://hydro:hydro_ci_password@127.0.0.1:5432/hydro
        run: |
          python -m pytest webapp/backend/tests/test_postgres_runtime.py -q
