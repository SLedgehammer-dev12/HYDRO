name: Test

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tasks/**'
      - 'agents/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # Tkinter tabanli UI testleri izole surecte kosulur (Tcl_AsyncDelete korumasi).
      - name: Run non-Tk desktop tests under Xvfb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          TMP_RUNNER="_ci_non_tk_runner.py"
          trap 'rm -f "$TMP_RUNNER"' EXIT
          cat <<'PY' > "$TMP_RUNNER"
          import pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path.cwd()))
          loader = unittest.TestLoader()
          suites = [
              loader.discover("tests", pattern=p.name)
              for p in sorted(pathlib.Path("tests").glob("test_*.py"))
              if p.name != "test_download_dialog.py"
          ]
          res = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(suites))
          sys.exit(0 if res.wasSuccessful() else 1)
          PY
          xvfb-run --auto-servernum python -m coverage run "$TMP_RUNNER"

      - name: Run isolated Tk dialog tests under Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum python -X dev -X faulthandler -m coverage run -a -m unittest tests.test_download_dialog -v

      - name: Run non-Tk desktop tests (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          TMP_RUNNER="_ci_non_tk_runner.py"
          trap 'rm -f "$TMP_RUNNER"' EXIT
          cat <<'PY' > "$TMP_RUNNER"
          import pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path.cwd()))
          loader = unittest.TestLoader()
          suites = [
              loader.discover("tests", pattern=p.name)
              for p in sorted(pathlib.Path("tests").glob("test_*.py"))
              if p.name != "test_download_dialog.py"
          ]
          res = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(suites))
          sys.exit(0 if res.wasSuccessful() else 1)
          PY
          python -m coverage run "$TMP_RUNNER"

      - name: Run isolated Tk dialog tests (macOS / Windows)
        if: runner.os != 'Linux'
        run: |
          python -X dev -X faulthandler -m coverage run -a -m unittest tests.test_download_dialog -v

      - name: Coverage report and XML
        run: |
          python -m coverage xml
          python -m coverage report

      # Tip kapisi lint.yml icinde (domain bloklayici, tam paket bilgilendirici) calisir;
      # matriste tekrarlanmaz.

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  web-backend-tests:
    name: Web Backend Pytest (py3.12 / ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-ocr.txt -r webapp/requirements-web.txt

      - name: Run web backend pytest suite with coverage gate
        run: |
          python -m coverage run --source=webapp/backend/app -m pytest webapp/backend/tests -q
          python -m coverage report --fail-under=80

  web-postgres-tests:
    name: Web Backend PostgreSQL Runtime (py3.12 / ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hydro
          POSTGRES_USER: hydro
          POSTGRES_PASSWORD: hydro_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hydro -d hydro"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Python + PostgreSQL driver dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-ocr.txt -r webapp/requirements-web.txt "psycopg[binary]>=3.2,<4"

      - name: Run PostgreSQL Alembic & CRUD smoke suite
        env:
          HYDRO_TEST_POSTGRES_URL: postgresql+psycopg://hydro:hydro_ci_password@127.0.0.1:5432/hydro
        run: |
          python -m pytest webapp/backend/tests/test_postgres_runtime.py -q

  web-browser-smoke:
    name: Web Real-Browser Tab Smoke (py3.12 + Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install Python & frontend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r webapp/requirements-web.txt
          npm --prefix webapp/frontend ci
          npm --prefix webapp/frontend run build

      - name: Ensure Chrome / Chromium is available
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null && ! command -v chromium-browser >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
          fi

      - name: Run 12-tab real browser smoke test
        run: |
          TMP_DATA="$(mktemp -d)"
          echo "TMP_DATA=$TMP_DATA" >> "$GITHUB_ENV"
          HYDRO_DATA_DIR="$TMP_DATA" python webapp/run_web.py --host 127.0.0.1 --port 8099 >"$TMP_DATA/server.log" 2>&1 &
          SRV_PID=$!
          trap 'kill "$SRV_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8099/api/health >/dev/null; then
              break
            fi
            sleep 0.5
          done
          HYDRO_APP_URL=http://127.0.0.1:8099 node webapp/frontend/scripts/verify-tabs.mjs

      - name: Upload smoke server log on failure
        if: failure() && env.TMP_DATA != ''
        uses: actions/upload-artifact@v7
        with:
          name: web-browser-smoke-log
          path: ${{ env.TMP_DATA }}/server.log
          if-no-files-found: ignore
          retention-days: 7
