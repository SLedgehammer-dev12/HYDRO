name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # pyproject.toml target-version ve mypy.ini python_version ile ayni hat.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      # Surumler requirements-dev.txt icinde pinli; CI ile yerel ortam ayni olsun.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -r webapp/requirements-web.txt

      - name: Run ruff (lint)
        run: |
          ruff check .

      - name: Run ruff (format check)
        run: |
          ruff format --check .

      # Domain katmani bloklayici: fizik/kabul kriteri degisiklikleri burada yakalanir.
      - name: Run mypy (domain, blocking)
        run: |
          mypy hidrostatik_test/domain/

      # Web backend servis ve API katmani da bloklayici tip kapisi ile korunur.
      - name: Run mypy (webapp backend, blocking)
        run: |
          mypy --ignore-missing-imports webapp/backend/app

      - name: Verify OpenAPI contract
        run: |
          PYTHONPATH=webapp/backend:. python -m app.tools.dump_openapi --check

      - name: Verify OpenAPI inventory in api_contract.md
        run: |
          PYTHONPATH=webapp/backend:. python3 -m app.tools.sync_api_inventory --check

      # UI katmani henuz tam tipli degil; rapor uret ama is akisini durdurma.
      - name: Run mypy (full, informational)
        continue-on-error: true
        run: |
          mypy --ignore-missing-imports --junit-xml=mypy-junit.xml hidrostatik_test/ webapp/backend/app

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mypy-report
          path: mypy-junit.xml
          if-no-files-found: warn
          retention-days: 7

  frontend-lint-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Bundle budget check
        run: npm run check:bundle

      - name: API contract check
        run: npm run check:api

      - name: API TypeScript types check
        run: npm run check:api-types

      - name: Dependency audit (high/critical)
        run: npm audit --omit=dev --audit-level=high
