name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # pyproject.toml target-version ve mypy.ini python_version ile ayni hat.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      # Surumler requirements-dev.txt icinde pinli; CI ile yerel ortam ayni olsun.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run ruff (lint)
        run: |
          ruff check hidrostatik_test/ tests/

      - name: Run ruff (format check)
        run: |
          ruff format --check hidrostatik_test/ tests/

      # Domain katmani bloklayici: fizik/kabul kriteri degisiklikleri burada yakalanir.
      - name: Run mypy (domain, blocking)
        run: |
          mypy hidrostatik_test/domain/

      # UI ve servis katmani henuz tam tipli degil; rapor uret ama is akisini durdurma.
      - name: Run mypy (full, informational)
        continue-on-error: true
        run: |
          mypy --ignore-missing-imports --junit-xml=mypy-junit.xml hidrostatik_test/

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy-junit.xml
          if-no-files-found: warn
          retention-days: 7
